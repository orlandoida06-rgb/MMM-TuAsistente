<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="70%">
    <stop offset="0%" stop-color="#101d35"/>
    <stop offset="100%" stop-color="#02040a"/>
  </radialGradient>

  <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#18e5ff"/>
    <stop offset="50%" stop-color="#668cff"/>
    <stop offset="100%" stop-color="#d84dff"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Fondo -->
<rect width="1000" height="1000" rx="180" fill="url(#bg)"/>

<!-- Halo -->
<circle
  cx="500"
  cy="430"
  r="365"
  fill="none"
  stroke="url(#neon)"
  stroke-width="14"
  filter="url(#glow)"
/>

<!-- Cabeza -->
<circle
  cx="500"
  cy="415"
  r="170"
  fill="#071525"
  stroke="url(#neon)"
  stroke-width="18"
/>

<!-- Auriculares -->
<rect
  x="310"
  y="345"
  width="38"
  height="145"
  rx="19"
  fill="url(#neon)"
  filter="url(#glow)"
/>

<rect
  x="652"
  y="345"
  width="38"
  height="145"
  rx="19"
  fill="url(#neon)"
  filter="url(#glow)"
/>

<!-- Ojos -->
<path
  d="M405 415 Q440 375 475 415"
  fill="none"
  stroke="#18e5ff"
  stroke-width="20"
  stroke-linecap="round"
/>

<path
  d="M525 415 Q560 375 595 415"
  fill="none"
  stroke="#18e5ff"
  stroke-width="20"
  stroke-linecap="round"
/>

<!-- Boca -->
<path
  d="M450 470 Q500 510 550 470"
  fill="none"
  stroke="url(#neon)"
  stroke-width="15"
  stroke-linecap="round"
/>

<!-- Voz / ecualizador -->
<g fill="url(#neon)" filter="url(#glow)">
  <rect x="350" y="555" width="30" height="65" rx="15"/>
  <rect x="405" y="525" width="30" height="105" rx="15"/>
  <rect x="460" y="490" width="30" height="145" rx="15"/>
  <rect x="515" y="525" width="30" height="105" rx="15"/>
  <rect x="570" y="555" width="30" height="65" rx="15"/>
</g>

<!-- Nombre -->
<text
  x="500"
  y="755"
  text-anchor="middle"
  font-family="Arial, Helvetica, sans-serif"
  font-size="88"
  font-weight="700"
  fill="white">
  Tu<tspan fill="url(#neon)">Asistente</tspan>
</text>

<!-- Línea inferior -->
<rect
  x="415"
  y="805"
  width="170"
  height="9"
  rx="5"
  fill="url(#neon)"
  filter="url(#glow)"
/>
</svg>
